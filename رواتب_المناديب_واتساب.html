<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>رواتب المناديب</title>
<style>
:root{--bg:#f5f6f8;--c:#fff;--t:#14181f;--m:#6b7380;--b:#e3e6eb;--g:#16a34a;--r:#dc2626;--a:#2563eb}
@media(prefers-color-scheme:dark){:root{--bg:#0e1116;--c:#171b22;--t:#e8ebf0;--m:#8b94a3;--b:#262c36}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;padding:12px;max-width:640px;margin:auto}
h1{font-size:18px;margin:6px 0 10px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
input,select,button{font:inherit;border-radius:10px;border:1px solid var(--b);background:var(--c);color:var(--t);padding:9px 11px}
input{flex:1;min-width:0}button{cursor:pointer}.pri{background:var(--g);color:#fff;border:0;font-weight:700}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.kpi div{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:10px;text-align:center}
.kpi b{display:block;font-size:17px}.kpi span{font-size:11px;color:var(--m)}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:12px;margin-bottom:10px}
.card.sent{opacity:.6}.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.nm{font-weight:700;font-size:15px;direction:auto}.sub{font-size:12px;color:var(--m)}
.net{font-weight:800;font-size:18px;white-space:nowrap}.pos{color:var(--g)}.neg{color:var(--r)}
.ln{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;border-bottom:1px dashed var(--b)}
.ln:last-child{border:0}.acts{display:flex;gap:8px;margin-top:10px}.acts input{direction:ltr;text-align:left}
.acts button{white-space:nowrap}.tag{font-size:11px;background:var(--bg);border-radius:6px;padding:2px 6px;color:var(--m)}
details{margin-bottom:10px}textarea{width:100%;height:90px;direction:ltr;background:var(--c);color:var(--t);border:1px solid var(--b);border-radius:10px;padding:8px}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script></head><body>
<h1>🦅 رواتب المناديب — نسور التوصيل</h1>
<div class="row"><button class="pri" id="imp0" style="flex:1">📂 استيراد شيت الرواتب (Excel)</button><input type="file" id="fileIn" accept=".xlsx,.xls" hidden></div>
<div class="kpi"><div><b id="k1">0</b><span>مندوب</span></div><div><b id="k2">0</b><span>تم الإرسال</span></div><div><b id="k3">0</b><span>جاهز للإرسال (له رقم)</span></div>
<div><b id="k4" class="pos">0</b><span>إجمالي المستحق</span></div><div><b id="k5" class="neg">0</b><span>رصيد عليهم</span></div><div><b id="k6">0</b><span>متوقفون</span></div></div>
<div class="sub" id="tot" style="margin:-4px 0 10px"></div>
<div class="row"><input id="mon" placeholder="الشهر" value="سبتمبر"><select id="flt"><option value="all">الكل</option><option value="todo">لم يُرسل</option><option value="sent">تم الإرسال</option></select></div>
<div class="row"><input id="q" placeholder="🔍 بحث بالاسم أو رقم الإقامة"></div>
<div class="row"><button class="pri" id="next" style="flex:1">⏭️ أرسل للتالي (اللي له رقم ولم يُرسل)</button></div>
<details><summary>📥 لصق أرقام الواتس دفعة واحدة</summary>
<p class="sub">كل سطر: رقم الإقامة ثم فاصلة ثم رقم الجوال (مثال: 2455768628,0551234567)</p>
<textarea id="bulk"></textarea><button id="imp" style="margin-top:6px">حفظ الأرقام</button></details>
<div id="list"></div>
<script>

السند"}, {"id": "2596981395", "name": "NASIR ALI MUHAMMAD SHARIF", "type": "راتب", "days": 30.0, "orders": 295.0, "base": 2300.0, "wallet": 495.87, "gross": -45.87, "fuel": 0, "debt": 0, "extra": 0, "comm": 0, "ded": 0.0, "net": -45.87, "note": ""}, {"id": "2627710250", "name": "SAJID SHAKOOR ABDUL SHAKOOR KHAN", "type": "راتب", "days": 30.0, "orders": 0.0, "base": 2000.0, "wallet": 0.0, "gross": -2500.0, "fuel": 0, "debt": 0, "extra": 0, "comm": 0, "ded": 0.0, "net": -2500.0, "note": ""}, {"id": "2627710730", "name": "AFRAN MAZHAR IQBAL", "type": "راتب", "days": 30.0, "orders": 131.0, "base": 2000.0, "wallet": 558.85, "gross": -1748.85, "fuel": 0, "debt": 0, "extra": 0, "comm": 0, "ded": 0.0, "net": -1748.85, "note": ""}, {"id": "2627710912", "name": "MUHAMMAD HASEEB SHAUKAT SHAUKAT IQBAL", "type": "راتب", "days": 30.0, "orders": 0.0, "base": 2000.0, "wallet": 0.0, "gross": -2500.0, "fuel": 0, "debt": 0, "extra": 0, "comm": 0, "ded": 0.0, "net": -2500.0, "note": "متوقف + مرفوع السند"}, {"id": "2637170529", "name": "GULFAM AHMAD MUSHTAQ AHMAD", "type": "راتب", "days": 30.0, "orders": 0.0, "base": 2000.0, "wallet": 0.0, "gross": -3500.0, "fuel": 0, "debt": 0, "extra": 0, "comm": 0, "ded": 0.0, "net": -3500.0, "note": "متوقف + مرفوع السند"}, {"id": "2637261187", "name": "ASAD ABBAS MUHAMMADO", "type": "احتياجات الأليفة", "days": 0, "orders": 0.0, "base": 0.0, "wallet": 0.0, "gross": 0.0, "fuel": 0, "debt": 0, "extra": 0, "comm": 0, "ded": 0.0, "net": 0.0, "note": ""}, {"id": "2638839890", "name": "MUHAMMAD AFAQ SIRAJ GUL", "type": "راتب", "days": 30.0, "orders": 490.0, "base": 2100.0, "wallet": 565.7, "gross": 934.3, "fuel": 0, "debt": 436.0, "extra": 0, "comm": 0, "ded": 436.0, "net": 498.3, "note": "تم التحويل يوم 02/11"}, {"id": "2640895898", "name": "ABDUL REHMAN MUNAWAR HUSSAIN", "type": "", "days": 0, "orders": 0, "base": 0, "wallet": 0, "gross": 0, "fuel": 0, "debt": 0, "extra": 0, "comm": 0, "ded": 0, "net": 0.0, "note": ""}];let S={};try{const x=localStorage.getItem("sal_data");if(x)D=JSON.parse(x);const m=localStorage.getItem("sal_mon");if(m)mon.value=m}catch(e){}
try{S=JSON.parse(localStorage.getItem('sal_v1')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('sal_v1',JSON.stringify(S))}catch(e){}};
const st=id=>S[id]||(S[id]={p:'',s:0});
const f=v=>Number(v).toLocaleString('en',{maximumFractionDigits:2});
const norm=p=>{p=(p||'').replace(/\D/g,'');if(!p)return'';if(p.startsWith('00'))p=p.slice(2);if(p.startsWith('966'))return p;if(p.startsWith('0'))p=p.slice(1);return'966'+p};
function msg(d){
 const L=[],a=(i,t,v)=>v?L.push(`${i} ${t}: ${f(v)} ر.س`):0;
 L.push(`أهلاً ${d.name} 👋`,`تفاصيل راتبك عن شهر ${mon.value}:`,'');
 if(d.days)L.push(`📅 أيام العمل: ${d.days}`);
 if(d.orders)L.push(`📦 عدد الطلبات: ${f(d.orders)}`);
 a('💼','راتب أيام العمل',d.base);a('👛','خصم المحفظة',d.wallet);a('💰','مجمل الراتب',d.gross);
 L.push('','➖ الاستقطاعات:');
 a('⛽','المحروقات',d.fuel);a('📄','مديونية',d.debt);a('🔁','مدد',d.extra);a('🏢','عمولة',d.comm);
 if(!d.ded)L.push('لا يوجد');else a('📉','إجمالي الاستقطاعات',d.ded);
 L.push('',d.net>=0?`✅ الصافي المستحق: ${f(d.net)} ر.س`:`⚠️ الرصيد عليك: ${f(-d.net)} ر.س`);
 if(d.note&&!/تم التحويل|متوقف/.test(d.note))L.push(`📝 ${d.note}`);
 L.push('','نسور التوصيل 🦅','للاستفسار تواصل مع المشرف.');
 return L.join('\n')}
function send(d){const p=norm(st(d.id).p);if(!p){alert('أدخل رقم الواتس أولاً');return false}
 window.open(`https://wa.me/${p}?text=${encodeURIComponent(msg(d))}`,'_blank');st(d.id).s=1;save();render();return true}
function render(){
 const q=document.getElementById('q').value.trim().toLowerCase(),fl=flt.value,box=list;box.innerHTML='';
 D.filter(d=>(!q||d.name.toLowerCase().includes(q)||d.id.includes(q))&&(fl=='all'||(fl=='sent')==!!st(d.id).s)).forEach(d=>{
  const c=document.createElement('div');c.className='card'+(st(d.id).s?' sent':'');
  const ln=(t,v)=>v?`<div class="ln"><span>${t}</span><span>${f(v)}</span></div>`:'';
  c.innerHTML=`<div class="top"><div><div class="nm">${d.name}</div><div class="sub">${d.id} · ${d.type||'—'} ${st(d.id).s?'<span class="tag">✓ أُرسل</span>':''}</div></div><div class="net ${d.net>=0?'pos':'neg'}">${f(d.net)}</div></div>
  <div style="margin-top:8px">${ln('الطلبات',d.orders)}${ln('راتب أيام العمل',d.base)}${ln('خصم المحفظة',d.wallet)}${ln('مجمل الراتب',d.gross)}${ln('المحروقات',d.fuel)}${ln('مديونية',d.debt)}${ln('مدد',d.extra)}${ln('عمولة',d.comm)}${ln('إجمالي الاستقطاعات',d.ded)}</div>
  ${d.note?`<div class="sub" style="margin-top:6px">📝 ${d.note}</div>`:''}
  <div class="acts"><input inputmode="tel" placeholder="رقم الواتس 05xxxxxxxx" value="${st(d.id).p}"><button class="pri">واتساب</button><button class="cp">نسخ</button></div>`;
  const inp=c.querySelector('input');inp.onchange=()=>{st(d.id).p=inp.value;save()};
  c.querySelector('.pri').onclick=()=>{st(d.id).p=inp.value;save();send(d)};
  c.querySelector('.cp').onclick=()=>navigator.clipboard&&navigator.clipboard.writeText(msg(d));
  box.appendChild(c)});
 k1.textContent=D.length;k2.textContent=D.filter(d=>st(d.id).s).length;k3.textContent=D.filter(d=>norm(st(d.id).p)&&!st(d.id).s).length;
 k4.textContent=f(D.reduce((s,d)=>s+Math.max(d.net,0),0));k5.textContent=D.filter(d=>d.net<0).length;k6.textContent=D.filter(d=>/متوقف/.test(d.note)).length;
 tot.textContent=`إجمالي المجمل ${f(D.reduce((s,d)=>s+d.gross,0))} · الاستقطاعات ${f(D.reduce((s,d)=>s+d.ded,0))} · صافي الكل ${f(D.reduce((s,d)=>s+d.net,0))} ر.س`}
const nz=s=>String(s==null?"":s).replace(/[ـ\s]/g,"").replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه");
const num=v=>{v=parseFloat(String(v==null?"":v).replace(/,/g,""));return isNaN(v)?0:Math.round(v*100)/100};
const MONTHS=["يناير","فبراير","مارس","ابريل","أبريل","مايو","يونيو","يوليو","اغسطس","أغسطس","سبتمبر","اكتوبر","أكتوبر","نوفمبر","ديسمبر"];
function parse(ws){
 const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});
 const h=(rows[0]||[]).map(nz);
 const g=(r,...ks)=>{for(const k of ks){const i=h.indexOf(nz(k));if(i>=0&&r[i]!=null&&r[i]!=="")return r[i]}return null};
 const out=[];
 rows.slice(1).forEach(r=>{const name=g(r,"الاسم");if(!name)return;
  const idv=g(r,"رقم الإقامة");const id=idv==null?String(name).trim():(typeof idv=="number"?String(Math.round(idv)):String(idv).trim());
  const ph=g(r,"رقم الواتس","الواتس","واتس","رقم الجوال","الجوال","جوال","موبايل","رقم الهاتف","الهاتف");
  out.push({id,name:String(name).trim(),type:String(g(r,"البيان")||"").trim(),days:num(g(r,"أيام العمل")),orders:num(g(r,"مجموع الطلبات")),
   base:num(g(r,"راتب أيام العمل")),wallet:num(g(r,"محفظة هنقر")),gross:num(g(r,"مجمل الراتب")),fuel:num(g(r,"المحروقات")),
   debt:num(g(r,"مديونة المندوب")),extra:num(g(r,"مدد")),comm:num(g(r,"عمولة")),ded:num(g(r,"م الأستقطاعات")),net:num(g(r,"الصافي")),
   note:String(g(r,"البنك")||"").trim(),ph:ph==null?"":String(ph)})});
 return out}
imp0.onclick=()=>fileIn.click();
fileIn.onchange=async e=>{const fl=e.target.files[0];if(!fl)return;
 try{const wb=XLSX.read(await fl.arrayBuffer(),{type:"array"});const nd=parse(wb.Sheets[wb.SheetNames[0]]);
  if(!nd.length)throw 0;D=nd;D.forEach(d=>{const s=st(d.id);s.s=0;if(d.ph&&!s.p)s.p=d.ph});save();
  const m=MONTHS.find(m=>fl.name.includes(m));if(m)mon.value=m;
  try{localStorage.setItem("sal_data",JSON.stringify(D));localStorage.setItem("sal_mon",mon.value)}catch(x){}
  render();window.scrollTo(0,0)}catch(err){alert("تعذر قراءة الشيت. تأكد أنه Excel بنفس أعمدة الرواتب، وأن الإنترنت شغال أول مرة لتحميل قارئ Excel.")}
 e.target.value=""};
q.oninput=render;flt.onchange=render;mon.oninput=()=>{try{localStorage.setItem("sal_mon",mon.value)}catch(e){}};
next.onclick=()=>{const d=D.find(d=>!st(d.id).s&&norm(st(d.id).p));d?send(d):alert('لا يوجد مندوب جاهز (أدخل الأرقام أو تم إرسال الكل)')};
imp.onclick=()=>{bulk.value.split('\n').forEach(l=>{const [i,p]=l.split(/[,،\t;]/).map(x=>x&&x.trim());if(i&&p&&D.some(d=>d.id==i))st(i).p=p});save();render();bulk.value=''};
render();
</script></body></html>
