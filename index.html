function readF(f){if(!f)return;if(typeof XLSX==='undefined'){$('#pprev').innerHTML='<span class="er">تعذر تحميل مكتبة Excel</span>';return}
const fr=new FileReader();fr.onerror=()=>$('#pprev').innerHTML='<span class="er">تعذر قراءة الملف</span>';
fr.onload=e=>{try{const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array',raw:true,codepage:65001});

const H=(A[0]||[]).map(h=>CM[nk(h)]||null);
if(!H.includes('Rider Id')){$('#pprev').innerHTML='<span class="er">لم يتم العثور على عمود Rider Id</span>';return}
const rows=A.slice(1).filter(r=>r.some(c=>c!=null&&String(c).trim()!==''));
const fp=hash(JSON.stringify(rows));
pend={file:f.name,fp,H,rows};

$('#pprev').innerHTML=`<div>تم التعرف على ${H.filter(Boolean).length} عموداً${unk?` (${unk} عمود غير معروف سيتم تجاهله)`:''}، ${rows.length} صف.</div><div class="w"><table><tr>${H.map(h=>`<th>${h||'؟'}</th>`).join('')}</tr>${rows.slice(0,5).map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div><button class="p" onclick="doImport()">تأكيد الاستيراد</button>`}catch(x){$('#pprev').innerHTML='<span class="er">ملف غير صالح</span>'}};
fr.readAsArrayBuffer(f)}
const SUMC=['Shifts','Working Days','Planned Working Hours','Actual Working Hours','Break Hours','Lost Hours','No Shows','Notified Deliveries','Completed Deliveries','Accepted Deliveries','Stacked Deliveries','Declined Deliveries','Cancelled Deliveries','Deduction Deliveries','Not Accepted Deliveries','Manual Undispatched'];
const WTC={'Attendance Rate':'Planned Working Hours','Acceptance Rate':'Notified Deliveries','Contact Rate':'Notified Deliveries','Rider-Customer Chat Response %':'Notified Deliveries','No Show %':'Shifts'};
function mergeRows(a){if(a.length===1)return a[0];const v={...a[0]};
SUMC.forEach(c=>{const xs=a.map(r=>num(r[c])).filter(x=>x!=null);v[c]=xs.length?Math.round(xs.reduce((p,q)=>p+q,0)*100)/100:null});
Object.keys(WTC).forEach(c=>{let s=0,t=0;a.forEach(r=>{const x=num(r[c]),y=num(r[WTC[c]]);if(x!=null&&y!=null){s+=x*y;t+=y}});if(t)v[c]=s/t});
if(num(v['Working Days']))v['Avg. Working Hours/ Day']=num(v['Actual Working Hours'])/num(v['Working Days']);
['Contract Name','City Name','Vehicle Name','Batch Number','TGA Status','Error Codes'].forEach(c=>{let u=[...new Set(a.map(r=>r[c]).filter(x=>x!=null).map(String))];if(c==='Error Codes'&&u.length>1)u=u.filter(x=>x!=='0');v[c]=u.length?u.join(' / '):null});
return v}
function doImport(){if(!pend)return;const from=$('#pfrom').value,to=$('#pto').value;
if(!from||!to||from>to)return toast('حدد فترة التقرير بشكل صحيح');
if(from.slice(0,7)!==to.slice(0,7))return toast('اجعل كل تقرير داخل شهر واحد (قسّم الفترة عند نهاية الشهر)');
const ov=db.imports.filter(i=>i.from<=to&&i.to>=from);
if(ov.some(i=>i.from===from&&i.to===to&&i.fp===pend.fp))return toast('هذا الملف مستورد لنفس الفترة — لم يتم التكرار');
const inside=ov.filter(i=>from<=i.from&&to>=i.to),bad=ov.filter(i=>!inside.includes(i));
if(bad.length)return toast('الفترة تتداخل مع تقرير مستورد ('+bad[0].from+' → '+bad[0].to+') وسيتكرر العد. اختر فترة لا تتداخل أو احذف التقرير القديم أولاً');
if(inside.length){toast('تم استبدال '+inside.length+' تقرير سابق داخل نفس الفترة');
const ids=inside.map(i=>i.id);db.imports=db.imports.filter(i=>!ids.includes(i.id));db.snaps=db.snaps.filter(s=>!ids.includes(s.imp))}
const id=uid(),seen={},dups=[],city=$('#pcity').value.trim();let n=0;
pend.rows.forEach(r=>{const v={};pend.H.forEach((h,i)=>{if(h){let x=r[i];if(typeof x==='string'){x=x.trim();if(x==='')x=null}v[h]=x}});
const rid=v['Rider Id'];if(rid==null){dups.push('صف بدون Rider Id');return}
const k=String(rid);if(city&&v['City Name']==null)v['City Name']=city;(seen[k]=seen[k]||[]).push(v)});
let rowsN=0;Object.keys(seen).forEach(k=>{rowsN+=seen[k].length;db.snaps.push({id:uid(),imp:id,rid:k,from,to,v:mergeRows(seen[k])});n++});
db.imports.push({id,file:pend.file,fp:pend.fp,from,to,city,n,dups,mrg:rowsN-n,at:new Date().toISOString()});
save();st.imp=id;pend=null;toast(`تم استيراد ${n} مندوب من ${rowsN} صف`+(rowsN>n?' (تم دمج الصفوف المتعددة للمندوب الواحد)':''));render()}
function exportCsv(){const im=db.imports.find(i=>i.id===(st.imp||(latestImp()||{}).id));if(!im)return toast('لا توجد بيانات');

function restoreBk(inp){const f=inp.files&&inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const b=JSON.parse(rd.result);if(!b||!Array.isArray(b.riders))throw 0;const G=new Set(db.gone||[]),mp={};const nr=[];(b.riders||[]).forEach(r=>{const ex=db.riders.find(x=>String(x.riderId)===String(r.riderId));if(ex)mp[r.id]=ex.id;else if(r.id&&!G.has(r.id)&&!db.riders.some(x=>x.id===r.id))nr.push(r)});
const K=['snaps','imports','tickets','tasks','docs'],add={riders:nr};K.forEach(k=>{const have=new Set((db[k]||[]).map(x=>x&&x.id));add[k]=(b[k]||[]).filter(x=>x&&x.id&&!have.has(x.id)&&!G.has(x.id)).map(x=>(k==='tickets'||k==='tasks'||k==='docs')&&mp[x.rid]?{...x,rid:mp[x.rid]}:x)});
const N={riders:'مناديب جدد',snaps:'صفوف أداء',imports:'تقارير',tickets:'مشكلات',tasks:'مهام',docs:'مستندات'};
ask('سيتم إضافة: '+Object.keys(add).map(k=>N[k]+' '+add[k].length).join('، ')+'. لن يُحذف أو يُستبدل أي سجل موجود. متابعة؟',()=>{Object.keys(add).forEach(k=>{db[k]=(db[k]||[]).concat(add[k])});db.cfg={...(b.cfg||{}),...db.cfg};save();inp.value='';render();toast('تمت الاستعادة')},'استعادة')}catch(e){toast('ملف غير صالح')}};rd.readAsText(f)}

const SH={on:false,db:null,assets:null,h:{},rev:null,t:null,busy:false,again:0};
const SK=['gone','riders','snaps','imports','tickets','tasks','docs','photos','cfg'],CH=50000;
function d2b(u){const a=u.split(','),b=atob(a[1]),w=new Uint8Array(b.length);for(let i=0;i<b.length;i++)w[i]=b.charCodeAt(i);return new Blob([w],{type:'image/jpeg'})}
function syncSoon(){if(!SH.on)return;clearTimeout(SH.t);SH.t=setTimeout(()=>shPush().catch(()=>toast('تعذرت المزامنة')),1200)}
async function shRead(k,n){let s='';for(let i=0;i<n;i++){const x=await SH.db.doc('state/'+k+'_'+i).get();s+=x.exists?(x.data().v||''):''}return s}
async function shPull(m,merge){for(const k of SK){const n=(m.n||{})[k];if(!n)continue;const s=await shRead(k,n);let v;try{v=JSON.parse(s)}catch(e){continue}
const chg=merge&&SH.h[k]!==hash(JSON.stringify(db[k]));
if(k==='gone'){db.gone=[...new Set([...(db.gone||[]),...(Array.isArray(v)?v:[])])];SH.h[k]=hash(s);continue}
if(chg){if(Array.isArray(v)&&Array.isArray(db[k])){const ids=new Set(db[k].map(x=>x&&x.id));db[k]=db[k].concat(v.filter(x=>x&&x.id&&!ids.has(x.id)))}}else db[k]=v;if(Array.isArray(db[k])){const G=new Set(db.gone||[]);db[k]=db[k].filter(x=>!(x&&((x.id&&G.has(x.id))||(x.rid&&G.has(x.rid)))))}SH.h[k]=hash(s)}
SH.rev=m.rev;PH=db.photos||[];mig(1);try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}if($('#m').style.display!=='flex')render()}
async function shPush(force){if(!SH.on)return;if(SH.busy){SH.again=1;return}SH.busy=true;
try{const mr=SH.db.doc('state/meta'),cur=await mr.get();if(!force&&cur.exists&&cur.data().rev!==SH.rev)await shPull(cur.data(),true);
const n={};let any=!!force;
for(const k of SK){const s=JSON.stringify(db[k]??(k==='cfg'?{}:[])),c=Math.max(1,Math.ceil(s.length/CH));n[k]=c;
if(force||SH.h[k]!==hash(s)){for(let i=0;i<c;i++)await SH.db.doc('state/'+k+'_'+i).set({v:s.slice(i*CH,(i+1)*CH)});SH.h[k]=hash(s);any=true}}
if(any){const rev=Date.now()+'-'+Math.random().toString(36).slice(2,6);await mr.set({n,rev});SH.rev=rev}
try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
finally{SH.busy=false;if(SH.again){SH.again=0;syncSoon()}}}
function b2du(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)})}
