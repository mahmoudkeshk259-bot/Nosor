function weekWin(endOff){

  const cov=new Set();db.imports.forEach(i=>{for(let d=new Date(i.from+'T00:00:00Z');d<=new Date(i.to+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+1))cov.add(d.toISOString().slice(0,10))});
  const last=[...cov].sort().pop();
  const end=new Date(last+'T00:00:00Z');end.setUTCDate(end.getUTCDate()-7*(endOff||0));
  const start=new Date(end);start.setUTCDate(start.getUTCDate()-6);
  const s=start.toISOString().slice(0,10),e=end.toISOString().slice(0,10);
  const days=[],missing=[];
  for(let d=new Date(start);d<=end;d.setUTCDate(d.getUTCDate()+1)){const k=d.toISOString().slice(0,10);days.push(k);if(!cov.has(k))missing.push(k)}
  const ims=db.imports.filter(i=>i.to>=s&&i.from<=e);
  return{from:s,to:e,days,missing,ims,covered:days.filter(d=>!missing.includes(d))};

    det.push([String(r.riderId),r.nameAr,r.city||'',r.vtype||'غير محدد',a.wd,a.ph,a.h,a.lh,a.bh,a.o,a.h>0?Math.round(a.o/a.h*100)/100:'',a.wd>0?Math.round(a.o/a.wd*100)/100:'',rateDispW(avgA(a.ar)),rateDispW(avgA(a.at)),t||'',exp==null?'':exp,pp==null?'':pp,st2,act2,qs.join(' | ')]);
  });
  /* المقارنات العادلة: نفس الفترة، تطبيع بالساعة وبيوم العمل */
  const grp=(key)=>{const g={};ridersAll.forEach(({r,a})=>{const k=key(r)||'غير محدد';const o=g[k]||(g[k]={n:0,o:0,h:0,wd:0,ar:[],at:[]});o.n++;o.o+=a.o;o.h+=a.h;o.wd+=a.wd;const x=avgA(a.ar);if(x!=null)o.ar.push(x);const y=avgA(a.at);if(y!=null)o.at.push(y)});return g};
  const cmpH=['المجموعة','المناديب','الطلبات','الطلبات/ساعة فعلية','الطلبات/يوم عمل مندوب','متوسط Acceptance Rate','متوسط Attendance Rate'];
  const cmpRows2=[cmpH];
  const pushG=(title,g)=>{cmpRows2.push([title,'','','','','','']);Object.keys(g).sort().forEach(k=>{const o=g[k];cmpRows2.push([k,o.n,o.o,o.h>0?Math.round(o.o/o.h*100)/100:'',o.wd>0?Math.round(o.o/o.wd*100)/100:'',rateDispW(avgA(o.ar)),rateDispW(avgA(o.at))])})};
  pushG('حسب المركبة',grp(r=>r.vtype));
  pushG('حسب المدينة',grp(r=>cKey(r.city)));
  /* يحتاجون متابعة */
  const fu=det.slice(1).filter(x=>x[17]==='أقل من المتوقع للأيام المغطاة فقط'||x[17]==='بدون تارجت').slice(0,15).map(x=>[x[1],x[0],x[15],x[16]===''?'—':x[16]+'%',x[17],x[18]]);
  /* الملخص */
  const S=[['التحليل الأسبوعي لأداء المناديب',''],['الفترة',w.from+' → '+w.to],['الأيام المغطاة بالتقارير ('+covN+')',w.covered.join('، ')],['أيام بلا تقارير ('+w.missing.length+')',w.missing.length?w.missing.join('، '):'لا يوجد'],['التقارير الداخلة في التجميع',w.ims.map(i=>esc(i.file||'')+' ('+i.from+' → '+i.to+')').join(' | ')],['',''],
    ['إجمالي الطلبات المكتملة',totO],['المناديب ذوو البيانات',riders.length],...(stoppedN?[['مستبعدون بحالة «موقوف» (بياناتهم محفوظة في التطبيق)',stoppedN]]:[]),['الساعات الفعلية',Math.round(totH*100)/100],['الطلبات لكل ساعة فعلية',oph==null?'غير متاح (ساعات = 0)':oph],['متوسط Acceptance Rate (من عمود التقرير، '+arV.length+' قيمة)',rateDispW(arAvg)||'غير متوفر'],['متوسط Attendance Rate (من عمود التقرير، '+atV.length+' قيمة)',rateDispW(atAvg)||'غير متوفر'],['',''],
    ['مقارنة بالأسبوع السابق ('+(prevW?prevW.from+' → '+prevW.to:'')+') — نفس الطول وبدون تداخل','']];
  if(cmpRows.length){S.push(['المؤشر','هذا الأسبوع | الأسبوع السابق | التغير %']);cmpRows.forEach(r=>S.push([r[0],r[1]+' | '+r[2]+' | '+(r[3]==null?'غير متاح':(r[3]>0?'+':'')+r[3]+'%')]))}
  else S.push(['المقارنة','لا توجد تغطية كافية في الأسبوع السابق — لا يُستنتج تحسن أو تراجع من فترة واحدة']);
  S.push(['',''],['يحتاجون متابعة (على الأيام المغطاة بالتقارير فقط)','']);
  if(fu.length)fu.forEach(x=>S.push([x[0]+' ('+x[1]+')','إنجاز الفترة المغطاة: '+x[3]+' — '+x[4]+' — '+x[5]]));
  else S.push(['لا توجد حالات','']);
  S.push(['',''],['منهجية القراءة',''],['','* المتوقع للفترة تقدير حسابي: التارجت الشهري ÷ أيام العمل الشهرية المعروفة في الإعدادات ('+W+' يوم) × الأيام المغطاة بالتقارير ('+covN+').'],['','ملف التقرير لا يحمل عمود تاريخ — الأيام المغطاة مأخوذة من نطاق «من/إلى» المُدخل عند الاستيراد، وعمود Working Days مقياس داخل التقرير وليس دليلًا على أيام بعينها. الإنجاز يُقرأ على الأيام المغطاة فقط ولا يعني تقصيرًا في الأسبوع الكامل عندما تكون التغطية جزئية.'],['','المعدلات (Acceptance/Attendance) متوسط القيم كما وردت في أعمدة التقرير ولا تُعاد حسابها. لا يُحكم على مندوب بالطلبات الخام وحدها — قارن بالساعة وبيوم العمل ضمن نفس الفترة.'],['','الأرقام حقائق مرصودة؛ أسباب الفجوات أسئلة مفتوحة تُسأل للمندوب ولا تُفترض. المندوب الموقوف لا يظهر في صفوف التفصيل، وتبقى طلباته المكتملة ضمن إجمالي الإنجاز، وفي التطبيق يُخصم من تارجت المنطقة الجزء المتبقي من تارجته فقط.']);
  if(unmatched)S.push(['تنبيه',unmatched+' Rider ID في التقارير غير مسجلين في التطبيق ولم يدخلوا في صفوف المناديب']);
  /* كتابة المصنف منسقًا عبر ExcelJS */
  const NAVY='FF1E3A6E',hdrFill={type:'pattern',pattern:'solid',fgColor:{argb:NAVY}},hdrFont={bold:true,color:{argb:'FFFFFFFF'},size:11};
  const wb=new ExcelJS.Workbook();
  const ws1=wb.addWorksheet('الملخص',{views:[{rightToLeft:true,state:'frozen',ySplit:1}]});
  ws1.columns=[{width:46},{width:95}];
  S.forEach(([k,v],i)=>{
    const r=ws1.addRow([k,v==null?'':String(v)]);
    if(i===0){r.font={bold:true,size:15,color:{argb:NAVY}};r.height=24}
    else if(k&&v===''){r.getCell(1).fill=hdrFill;r.getCell(2).fill=hdrFill;r.getCell(1).font=hdrFont;r.getCell(2).font=hdrFont}
    else{r.getCell(1).font={bold:true};r.getCell(1).alignment={vertical:'top',wrapText:true};r.getCell(2).alignment={wrapText:true,vertical:'top'};const L=String(v||'').length;if(L>90)r.height=Math.min(160,Math.ceil(L/85)*15)}
  });
  ws1.pageSetup={fitToPage:true,fitToWidth:1,fitToHeight:0,orientation:'portrait'};
  const ws2=wb.addWorksheet('تفصيل المناديب',{views:[{rightToLeft:true,state:'frozen',ySplit:1}]});
  ws2.columns=[12,22,15,10,12,12,12,12,12,12,12,12,14,14,12,14,12,22,34,46].map(w=>({width:w}));
  const hr=ws2.addRow(detH);hr.eachCell(c=>{c.fill=hdrFill;c.font=hdrFont;c.alignment={wrapText:true,vertical:'middle',horizontal:'center'}});hr.height=30;
  det.slice(1).forEach(row=>{const r=ws2.addRow(row);r.eachCell((c,ci)=>{c.alignment={wrapText:ci>=19,vertical:'top'}})});
  ws2.autoFilter={from:{row:1,column:1},to:{row:1,column:detH.length}};
  ws2.pageSetup={fitToPage:true,fitToWidth:1,fitToHeight:0,orientation:'landscape'};
  const ws3=wb.addWorksheet('مقارنات عادلة',{views:[{rightToLeft:true}]});
  ws3.columns=[{width:22},{width:10},{width:10},{width:18},{width:20},{width:22},{width:22}];
  cmpRows2.forEach((row,i)=>{
    const r=ws3.addRow(row);
    if(i===0){r.eachCell(c=>{c.fill=hdrFill;c.font=hdrFont;c.alignment={wrapText:true,vertical:'middle'}});r.height=26}
    else if(row[0]&&row[1]===''){r.getCell(1).font={bold:true,color:{argb:NAVY},size:12}}
  });
  ws3.pageSetup={fitToPage:true,fitToWidth:1,fitToHeight:0};
  const buf=await wb.xlsx.writeBuffer();
  saveFile('تحليل_الأداء_الأسبوعي_'+w.to+'.xlsx',new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  toast('تم تصدير التحليل الأسبوعي — الفترة '+w.from+' → '+w.to+(w.missing.length?' ('+w.missing.length+' أيام بلا تقارير)':''));
}
