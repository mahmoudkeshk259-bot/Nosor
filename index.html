const SH={on:false,db:null,assets:null,h:{},rev:null,t:null,busy:false,again:0};
const SK=['gone','riders','snaps','imports','tickets','tasks','docs','photos','cfg'],CH=50000;
function d2b(u){const a=u.split(','),b=atob(a[1]),w=new Uint8Array(b.length);for(let i=0;i<b.length;i++)w[i]=b.charCodeAt(i);return new Blob([w],{type:'image/jpeg'})}
function syncSoon(){if(!SH.on)return;clearTimeout(SH.t);SH.t=setTimeout(()=>shPush().catch(()=>toast('تعذرت المزامنة')),1200)}
async function shRead(k,n){let s='';for(let i=0;i<n;i++){const x=await SH.db.doc('state/'+k+'_'+i).get();s+=x.exists?(x.data().v||''):''}return s}
async function shPull(m,merge){for(const k of SK){const n=(m.n||{})[k];if(!n)continue;const s=await shRead(k,n);let v;try{v=JSON.parse(s)}catch(e){continue}
const chg=merge&&SH.h[k]!==hash(JSON.stringify(db[k]));
if(k==='gone'){db.gone=[...new Set([...(db.gone||[]),...(Array.isArray(v)?v:[])])];SH.h[k]=hash(s);continue}
if(chg){if(Array.isArray(v)&&Array.isArray(db[k])){const ids=new Set(db[k].map(x=>x&&x.id));db[k]=db[k].concat(v.filter(x=>x&&x.id&&!ids.has(x.id)))}}else db[k]=v;if(Array.isArray(db[k])){const G=new Set(db.gone||[]);db[k]=db[k].filter(x=>!(x&&((x.id&&G.has(x.id))||(x.rid&&G.has(x.rid)))))}SH.h[k]=hash(s)}
SH.rev=m.rev;PH=db.photos||[];mig(1);try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}if($('#m').style.display!=='flex')render()}
async function shPush(force){if(!SH.on)return;if(SH.busy){SH.again=1;return}SH.busy=true;
try{const mr=SH.db.doc('state/meta'),cur=await mr.get();if(!force&&cur.exists&&cur.data().rev!==SH.rev)await shPull(cur.data(),true);
const n={};let any=!!force;
for(const k of SK){const s=JSON.stringify(db[k]??(k==='cfg'?{}:[])),c=Math.max(1,Math.ceil(s.length/CH));n[k]=c;
if(force||SH.h[k]!==hash(s)){for(let i=0;i<c;i++)await SH.db.doc('state/'+k+'_'+i).set({v:s.slice(i*CH,(i+1)*CH)});SH.h[k]=hash(s);any=true}}
if(any){const rev=Date.now()+'-'+Math.random().toString(36).slice(2,6);await mr.set({n,rev});SH.rev=rev}
try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
finally{SH.busy=false;if(SH.again){SH.again=0;syncSoon()}}}
